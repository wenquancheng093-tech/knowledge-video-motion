<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1280,height=720"><title>FX-003 大字锚点加数字与注释</title>
<script src="assets/gsap.min.js"></script><script src="data/content.js"></script>
<style>
@font-face{font-family:DemoSans;src:local("Noto Sans SC"),local("PingFang SC"),local("Microsoft YaHei");font-weight:400}
@font-face{font-family:DemoSans;src:local("Noto Sans SC"),local("PingFang SC"),local("Microsoft YaHei");font-weight:700}



*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#101820}
#root{position:relative;width:1280px;height:720px;overflow:hidden;background:radial-gradient(circle at 83% 19%,#243342 0,transparent 35%),#101820;color:#f5f6f3;font-family:DemoSans,sans-serif}
.grid{position:absolute;inset:0;background-image:radial-gradient(#62808a 1px,transparent 1px);background-size:30px 30px;opacity:.22}
.glow{position:absolute;width:590px;height:590px;right:-210px;top:-200px;border-radius:50%;background:#d24d83;filter:blur(180px);opacity:.12}
.content{position:absolute;inset:0}
.gold{color:#f0cb69}.pink{color:#f05d9a}.muted{color:#a9bdc2}
.rule{position:absolute;left:96px;right:96px;bottom:88px;height:1px;background:linear-gradient(90deg,#efc869,#58717b,transparent)}

  .stage{position:absolute;left:130px;right:125px;top:151px;height:440px;display:grid;grid-template-columns:32% 68%;align-items:center}
  #anchor{font-size:245px;line-height:1;font-weight:700;color:#f5f6f3;text-shadow:12px 15px 0 #080f15}
  #r{padding-left:85px;border-left:1px solid #637785}
  #metric{font-size:118px;line-height:1.1;font-weight:700;color:#f05d9a}
  #detail{margin-top:13px;font-size:50px;line-height:1.25;font-weight:700;white-space:pre-line}
  </style></head>
<body><main id="root" data-composition-id="fx-003-sample" data-start="0" data-width="1280" data-height="720" data-fps="30" data-duration="4.6">
<div class="grid" data-layout-ignore></div><div class="glow" data-layout-ignore></div><div class="content"><div class="stage"><div id="anchor"></div><div id="r"><div id="metric"></div><div id="detail"></div></div></div></div><div class="rule" data-layout-ignore></div>
</main><script>
  const d=window.FX_CONTENT;for(const k of ['anchor','metric','detail'])document.getElementById(k).textContent=d[k];
  const tl=gsap.timeline({paused:true});
  tl.fromTo('#metric',{opacity:0,y:35,filter:'blur(16px)'},{opacity:1,y:0,filter:'blur(0px)',duration:.55,ease:'power3.out'},.20);
  tl.fromTo('#anchor',{opacity:0,x:-28,filter:'blur(13px)'},{opacity:1,x:0,filter:'blur(0px)',duration:.6,ease:'power3.out'},.70);
  tl.fromTo('#detail',{opacity:0,y:30,filter:'blur(13px)'},{opacity:1,y:0,filter:'blur(0px)',duration:.58,ease:'power3.out'},1.08);

window.__timelines=window.__timelines||{};
window.__timelines['fx-003-sample']=tl;tl.seek(0);
</script></body></html>
