<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1280,height=720"><title>FX-001 短句分层与关键词逐步强调</title>
<script src="assets/gsap.min.js"></script><script src="data/content.js"></script>
<style>
@font-face{font-family:DemoSans;src:local("Noto Sans SC"),local("PingFang SC"),local("Microsoft YaHei");font-weight:400}
@font-face{font-family:DemoSans;src:local("Noto Sans SC"),local("PingFang SC"),local("Microsoft YaHei");font-weight:700}



*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#101820}
#root{position:relative;width:1280px;height:720px;overflow:hidden;background:radial-gradient(circle at 83% 19%,#243342 0,transparent 35%),#101820;color:#f5f6f3;font-family:DemoSans,sans-serif}
.grid{position:absolute;inset:0;background-image:radial-gradient(#62808a 1px,transparent 1px);background-size:30px 30px;opacity:.22}
.glow{position:absolute;width:590px;height:590px;right:-210px;top:-200px;border-radius:50%;background:#d24d83;filter:blur(180px);opacity:.12}
.content{position:absolute;inset:0}
.gold{color:#f0cb69}.pink{color:#f05d9a}.muted{color:#a9bdc2}
.rule{position:absolute;left:96px;right:96px;bottom:88px;height:1px;background:linear-gradient(90deg,#efc869,#58717b,transparent)}

  .stage{position:absolute;left:110px;right:110px;top:205px;height:330px;display:flex;align-items:center;justify-content:center}
  #line{position:absolute;left:0;right:0;top:64px;text-align:center;font-size:84px;letter-spacing:5px;font-weight:700;white-space:nowrap}
  #line #keyword{color:#f5f6f3}
  #under{position:absolute;width:235px;height:7px;top:174px;left:50%;margin-left:-117px;border-radius:10px;background:#f0cb69;transform-origin:left center}
  #second{position:absolute;top:203px;left:0;right:0;text-align:center;font-size:61px;color:#f05d9a;font-weight:700;letter-spacing:4px}
  </style></head>
<body><main id="root" data-composition-id="fx-001-sample" data-start="0" data-width="1280" data-height="720" data-fps="30" data-duration="4.6">
<div class="grid" data-layout-ignore></div><div class="glow" data-layout-ignore></div><div class="content"><div class="stage"><div id="line"></div><div id="under"></div><div id="second"></div></div></div><div class="rule" data-layout-ignore></div>
</main><script>
  const d=window.FX_CONTENT;
  document.querySelector('#line').innerHTML=d.headline.replace(d.emphasis,'<span id="keyword">'+d.emphasis+'</span>');
  document.querySelector('#second').textContent=d.second;
  const tl=gsap.timeline({paused:true});
  tl.fromTo('#line',{opacity:0,y:34,filter:'blur(12px)'},{opacity:1,y:0,filter:'blur(0px)',duration:.5,ease:'power3.out'},.15);
  tl.fromTo('#under',{scaleX:0,opacity:0},{scaleX:1,opacity:1,duration:.4,ease:'power2.out'},.52);
  tl.to('#keyword',{color:'#f05d9a',duration:.28},1.04);
  tl.to('#line',{y:-64,scale:.78,duration:.58,ease:'power3.inOut'},1.82);
  tl.to('#under',{y:-63,scaleX:.80,duration:.55,ease:'power3.inOut'},1.84);
  tl.fromTo('#second',{opacity:0,y:42,filter:'blur(10px)'},{opacity:1,y:0,filter:'blur(0px)',duration:.62,ease:'power3.out'},2.24);

window.__timelines=window.__timelines||{};
window.__timelines['fx-001-sample']=tl;tl.seek(0);
</script></body></html>
