<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1280,height=720"><title>FX-005 3D透视字幕</title>
<script src="assets/gsap.min.js"></script><script src="data/content.js"></script>
<style>
@font-face{font-family:DemoSans;src:local("Noto Sans SC"),local("PingFang SC"),local("Microsoft YaHei");font-weight:400}
@font-face{font-family:DemoSans;src:local("Noto Sans SC"),local("PingFang SC"),local("Microsoft YaHei");font-weight:700}



*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#101820}
#root{position:relative;width:1280px;height:720px;overflow:hidden;background:radial-gradient(circle at 83% 19%,#243342 0,transparent 35%),#101820;color:#f5f6f3;font-family:DemoSans,sans-serif}
.grid{position:absolute;inset:0;background-image:radial-gradient(#62808a 1px,transparent 1px);background-size:30px 30px;opacity:.22}
.glow{position:absolute;width:590px;height:590px;right:-210px;top:-200px;border-radius:50%;background:#d24d83;filter:blur(180px);opacity:.12}
.content{position:absolute;inset:0}
.gold{color:#f0cb69}.pink{color:#f05d9a}.muted{color:#a9bdc2}
.rule{position:absolute;left:96px;right:96px;bottom:88px;height:1px;background:linear-gradient(90deg,#efc869,#58717b,transparent)}

  .stage{position:absolute;left:125px;right:125px;top:138px;height:470px;perspective:950px}
  .line{position:absolute;left:110px;right:110px;text-align:center;font-size:101px;font-weight:700;letter-spacing:17px;white-space:nowrap;text-shadow:11px 16px 0 rgba(0,0,0,.45)}
  #line1{top:50px;transform-origin:left center;color:#f5f6f3}
  #line2{top:218px;transform-origin:right center;color:#f05d9a}
  .floor{position:absolute;left:140px;right:140px;bottom:5px;height:2px;background:linear-gradient(90deg,transparent,#87949e,transparent);opacity:.45}
  </style></head>
<body><main id="root" data-composition-id="fx-005-sample" data-start="0" data-width="1280" data-height="720" data-fps="30" data-duration="4.6">
<div class="grid" data-layout-ignore></div><div class="glow" data-layout-ignore></div><div class="content"><div class="stage"><div class="floor" data-layout-ignore></div><div id="line1" class="line"></div><div id="line2" class="line"></div></div></div><div class="rule" data-layout-ignore></div>
</main><script>
  const d=window.FX_CONTENT;for(const k of ['line1','line2'])document.getElementById(k).textContent=d[k];
  const tl=gsap.timeline({paused:true});
  tl.fromTo('#line1',{opacity:0,rotateY:-40,x:-120,scale:.73,clipPath:'inset(0 100% 0 0)'},{opacity:1,rotateY:-18,x:0,scale:1,clipPath:'inset(0 0% 0 0)',duration:.85,ease:'power3.out'},.28);
  tl.fromTo('#line2',{opacity:0,rotateY:40,x:120,scale:.73,clipPath:'inset(0 0 0 100%)'},{opacity:1,rotateY:18,x:0,scale:1,clipPath:'inset(0 0 0 0%)',duration:.85,ease:'power3.out'},1.15);
  tl.to('#line1',{rotateY:-13,duration:.55,ease:'power1.inOut'},2.28);
  tl.to('#line2',{rotateY:13,duration:.55,ease:'power1.inOut'},2.28);

window.__timelines=window.__timelines||{};
window.__timelines['fx-005-sample']=tl;tl.seek(0);
</script></body></html>
