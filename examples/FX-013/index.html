div class="name" id="product"></div><section class="info" id="info"><span class="tag" id="label"></span><h2>选择时重点看</h2><div id="rows"></div></section></main><script>const C=window.CONTENT;document.getElementById('title').innerHTML=C.title.replace('关键配置','<span class="accent">关键配置</span>');document.getElementById('product').textContent=C.product;document.getElementById('label').textContent=C.label;document.getElementById('rows').innerHTML=C.features.map((x,i)=>`<div class="row" id="row${i}"><b>0${i+1}</b><span>${x}</span></div>`).join('');const tl=gsap.timeline({paused:true});tl.fromTo('#title',{opacity:0,y:-22},{opacity:1,y:0,duration:.5,ease:'power3.out'},.08).fromTo('#podium',{opacity:0,y:45},{opacity:1,y:0,duration:.5,ease:'power3.out'},.18).fromTo('#device',{opacity:0,y:75,scale:.9},{opacity:1,y:0,scale:1,duration:.7,ease:'back.out(1.3)'},.34).fromTo('#product',{opacity:0,y:16},{opacity:1,y:0,duration:.35},.84).fromTo('#info',{opacity:0,x:70},{opacity:1,x:0,duration:.55,ease:'power3.out'},.63);C.features.forEach((_,i)=>tl.fromTo('#row'+i,{opacity:0,x:25},{opacity:1,x:0,duration:.34,ease:'power2.out'},1.45+i*.58));window.__timelines['fx-013-sample']=tl;tl.seek(0);</script></body></html>
