<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1280,height=720"><title>FX-006 旧字幕变淡，新重点在前</title>
<script src="assets/gsap.min.js"></script><script src="data/content.js"></script>
<style>
@font-face{font-family:DemoSans;src:local("Noto Sans SC"),local("PingFang SC"),local("Microsoft YaHei");font-weight:400}
@font-face{font-family:DemoSans;src:local("Noto Sans SC"),local("PingFang SC"),local("Microsoft YaHei");font-weight:700}



*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#101820}
#root{position:relative;width:1280px;height:720px;overflow:hidden;background:radial-gradient(circle at 83% 19%,#243342 0,transparent 35%),#101820;color:#f5f6f3;font-family:DemoSans,sans-serif}
.grid{position:absolute;inset:0;background-image:radial-gradient(#62808a 1px,transparent 1px);background-size:30px 30px;opacity:.22}
.glow{position:absolute;width:590px;height:590px;right:-210px;top:-200px;border-radius:50%;background:#d24d83;filter:blur(180px);opacity:.12}
.content{position:absolute;inset:0}
.gold{color:#f0cb69}.pink{color:#f05d9a}.muted{color:#a9bdc2}
.rule{position:absolute;left:96px;right:96px;bottom:88px;height:1px;background:linear-gradient(90deg,#efc869,#58717b,transparent)}

  .stage{position:absolute;left:155px;right:155px;top:135px;height:480px}
  .step{position:absolute;font-size:80px;line-height:1.15;font-weight:700;white-space:nowrap;text-shadow:8px 10px 0 #0b121b}
  #step1{left:0;top:22px;color:#f5f6f3}
  #step2{left:150px;top:159px;color:#f5f6f3}
  #step3{left:300px;top:296px;color:#f05d9a}
  </style></head>
<body><main id="root" data-composition-id="fx-006-sample" data-start="0" data-width="1280" data-height="720" data-fps="30" data-duration="4.6">
<div class="grid" data-layout-ignore></div><div class="glow" data-layout-ignore></div><div class="content"><div class="stage"><div id="step1" class="step"></div><div id="step2" class="step"></div><div id="step3" class="step"></div></div></div><div class="rule" data-layout-ignore></div>
</main><script>
  const d=window.FX_CONTENT;d.lines.forEach((s,i)=>document.getElementById('step'+(i+1)).textContent=s);
  const tl=gsap.timeline({paused:true});
  tl.fromTo('#step1',{opacity:0,y:42,clipPath:'inset(0 0 100% 0)'},{opacity:1,y:0,clipPath:'inset(0 0 0% 0)',duration:.45,ease:'power3.out'},.20);
  tl.to('#step1',{opacity:.34,duration:.28},1.13);
  tl.fromTo('#step2',{opacity:0,y:42,clipPath:'inset(0 0 100% 0)'},{opacity:1,y:0,clipPath:'inset(0 0 0% 0)',duration:.45,ease:'power3.out'},1.17);
  tl.to('#step2',{opacity:.34,duration:.28},2.18);
  tl.fromTo('#step3',{opacity:0,y:42,clipPath:'inset(0 0 100% 0)'},{opacity:1,y:0,clipPath:'inset(0 0 0% 0)',duration:.46,ease:'power3.out'},2.21);

window.__timelines=window.__timelines||{};
window.__timelines['fx-006-sample']=tl;tl.seek(0);
</script></body></html>
