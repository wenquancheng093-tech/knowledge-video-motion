<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1280,height=720"><title>FX-004 问题标题与叠层重点标题</title>
<script src="assets/gsap.min.js"></script><script src="data/content.js"></script>
<style>
@font-face{font-family:DemoSans;src:local("Noto Sans SC"),local("PingFang SC"),local("Microsoft YaHei");font-weight:400}
@font-face{font-family:DemoSans;src:local("Noto Sans SC"),local("PingFang SC"),local("Microsoft YaHei");font-weight:700}



*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#101820}
#root{position:relative;width:1280px;height:720px;overflow:hidden;background:radial-gradient(circle at 83% 19%,#243342 0,transparent 35%),#101820;color:#f5f6f3;font-family:DemoSans,sans-serif}
.grid{position:absolute;inset:0;background-image:radial-gradient(#62808a 1px,transparent 1px);background-size:30px 30px;opacity:.22}
.glow{position:absolute;width:590px;height:590px;right:-210px;top:-200px;border-radius:50%;background:#d24d83;filter:blur(180px);opacity:.12}
.content{position:absolute;inset:0}
.gold{color:#f0cb69}.pink{color:#f05d9a}.muted{color:#a9bdc2}
.rule{position:absolute;left:96px;right:96px;bottom:88px;height:1px;background:linear-gradient(90deg,#efc869,#58717b,transparent)}

  .stage{position:absolute;left:105px;right:105px;top:170px;height:370px}
  #qmark{position:absolute;right:60px;top:-90px;font-size:390px;line-height:1;color:#becad5;opacity:.15;font-weight:700}
  #question,#highlight{position:absolute;top:70px;font-size:111px;line-height:1.25;font-weight:700;white-space:nowrap;letter-spacing:5px}
  #question{left:80px}
  #highlight{left:506px;color:#f05d9a}
  #answer{position:absolute;left:82px;top:260px;font-size:43px;color:#f0cb69;letter-spacing:6px}
  </style></head>
<body><main id="root" data-composition-id="fx-004-sample" data-start="0" data-width="1280" data-height="720" data-fps="30" data-duration="4.6">
<div class="grid" data-layout-ignore></div><div class="glow" data-layout-ignore></div><div class="content"><div class="stage"><div id="qmark" data-layout-ignore>?</div><div id="question"></div><div id="highlight"></div><div id="answer"></div></div></div><div class="rule" data-layout-ignore></div>
</main><script>
  const d=window.FX_CONTENT;for(const k of ['question','highlight','answer'])document.getElementById(k).textContent=d[k];
  const tl=gsap.timeline({paused:true});
  tl.fromTo('#question',{opacity:0,scale:.74,y:30},{opacity:1,scale:1,y:0,duration:.52,ease:'back.out(1.5)'},.18);
  tl.fromTo('#highlight',{opacity:0,x:-44,filter:'blur(12px)'},{opacity:1,x:0,filter:'blur(0px)',duration:.55,ease:'power3.out'},.72);
  tl.fromTo('#qmark',{opacity:0,scale:.65,rotate:-12},{opacity:.15,scale:1,rotate:0,duration:.75,ease:'power3.out'},1.16);
  tl.fromTo('#answer',{opacity:0,y:20},{opacity:1,y:0,duration:.42,ease:'power3.out'},1.89);

window.__timelines=window.__timelines||{};
window.__timelines['fx-004-sample']=tl;tl.seek(0);
</script></body></html>
